[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hdmaps"
version = "1.0.0"
description = "Reproduce HD-MAPS Table 6.4: simultaneous arrival, staggered arrival, and online reconfiguration."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "stable-baselines3==2.8.0a2",
  "gymnasium==1.2.3",
  "highway-env==1.10.2",
  "torch==2.9.1",
  "numpy==2.4.0",
  "matplotlib==3.10.8",
]

[project.scripts]
hdmaps = "hdmaps.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
